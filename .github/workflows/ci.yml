name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix install
      - run: cmake -S examples/embedding -B consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - run: cmake --build consumer --config Release
      - run: ctest --test-dir consumer -C Release --output-on-failure
      - run: python tests/quickstart.py build/bin/persistscope
  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPERSISTScope_SANITIZERS=ON -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  fuzz:
    name: Fuzz smoke (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: clang++ -std=c++20 -g -fsanitize=fuzzer,address,undefined -Iinclude tests/fuzz_core.cpp src/persistscope.cpp -o fuzz_core
      - run: ./fuzz_core -runs=10000 -max_len=64
  quality:
    name: Format and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_format.py
      - run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build --parallel 2
      - run: clang-tidy -p build src/persistscope.cpp src/cli.cpp --warnings-as-errors='*'
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: python scripts/source_hygiene.py
      - name: Gitleaks 8.30.1
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
