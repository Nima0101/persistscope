name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 7 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
