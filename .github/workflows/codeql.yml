name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 7 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
